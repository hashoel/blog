<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="120" height="120" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
    <title id="title">Flat question mark icon</title>
    <desc id="desc">A flat circular icon with a centered question mark</desc>

    <!-- flat background circle -->
    <circle cx="60" cy="60" r="50" fill="#e2e8f0"/>

    <!-- question mark -->
    <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
          font-family="Inter, Arial, sans-serif" font-size="60" fill="#1e293b" font-weight="600">
        ?
    </text>
</svg>
